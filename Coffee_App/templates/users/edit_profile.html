{{ extends "base.html" %}}

{% block title %}プロフィール編集 - ぬまりば{% endblock %}

{% block content &}
<section class="profile-edit-container">
    <h1>プロフィール編集</h1>

    <form
        method="post"
        action="{{ url_for('users.edit_profile')}}"
        enctype="multipart/form-data"
    >
        {% if form %}
            {{ form.hidden_tag() }}
        {% endif %}

        <div class="form-group">
            <p>現在のアイコン</p>

            <img
                src="{{ current_user.profile_image_url
                    or url_for('static', filename='images/default_icon.png' )}}"
                alt="現在のプロフィール画像"
                class="profile-icon"
            >
        </div>

        <div class="form-group">
            <label for="profile_image">新しいアイコン</label>
            <input
                type="file"
                id="profile_image"
                name="profile_image"
                accept="image/jpev,image/png,image/webp"
            >
        </div>

        <div class="form-group">
            <label for="username">ユーザー名</label>
            <input
                type="text"
                id="username"
                name="username"
                maxlength="50"
                value="{{ current_user.username }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="profile_text">自己紹介</label>
            <textarea
                id="profile_text"
                name="profile_text"
                rows="5"
                maxlength="255"
            >{{ current_user.profile_text or ''}}</textarea>
        </div>

        <button type="submit">変更を保存する</button>
    </form>
</section>
{% endblock %}
